# Local infrastructure. The "api" and "web" services are added in Task 6.2.
# Copy .env.example to .env first (defaults below also work without it).

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-shopkeeper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-shopkeeper_dev}
      POSTGRES_DB: ${POSTGRES_DB:-shopkeeper}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-shopkeeper} -d ${POSTGRES_DB:-shopkeeper}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Unity WebGL build output (Brotli-compressed *.br files).
      - ./apps/web/public/webgl-build:/usr/share/nginx/html/webgl-build:ro
    # No depends_on: Nginx must start even when the api service is absent.
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
