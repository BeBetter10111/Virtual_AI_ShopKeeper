[tool.ruff]
line-length = 88
target-version = "py311"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# "app" has no __init__.py files (namespace package), so mypy needs these two.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type information used by later tasks.
[[tool.mypy.overrides]]
module = [
  "pgvector.*",
  "cv2.*",
  "open_clip.*",
  "torch.*",
  "transformers.*",
  "langchain.*",
  "langchain_core.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
