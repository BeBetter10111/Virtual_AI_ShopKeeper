# Nginx config for the Virtual AI Shopkeeper edge.
# - Serves Unity WebGL builds that are already Brotli-compressed (*.br).
# - Proxies /api/ and /ws/ to the FastAPI service ("api"), which may not exist yet.

# Needed for WebSocket upgrades.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Log $uri (no query string) instead of $request so the WebSocket
# ?token=<access_token> never lands in the access log.
log_format no_query '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                    '$status $body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /dev/stdout no_query;

    root /usr/share/nginx/html;

    # Docker's embedded DNS. Combined with a variable in proxy_pass, the upstream
    # is resolved per request, so Nginx starts even when "api" does not exist yet.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---- Unity WebGL: pre-compressed files -------------------------------
    # The official Nginx image has no Brotli module, so we serve the .br files
    # as-is and set Content-Encoding plus the Content-Type of the ORIGINAL file.
    # (add_header in a location replaces server-level ones, so each repeats what it needs.)

    location ~ ^/webgl-build/.+\.wasm\.br$ {
        default_type application/wasm;
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ ^/webgl-build/.+\.js\.br$ {
        default_type application/javascript;
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location ~ ^/webgl-build/.+\.(data|symbols\.json)\.br$ {
        default_type application/octet-stream;
        add_header Content-Encoding br always;
        add_header Cache-Control "public, max-age=3600" always;
    }

    # Everything else in the build folder (loader, uncompressed assets).
    # Plain prefix on purpose: with ^~ Nginx would skip the regex locations above.
    location /webgl-build/ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # ---- REST API --------------------------------------------------------
    location ^~ /api/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;   # no URI part: the original request URI is forwarded unchanged

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Visual-search fallback uploads are <= 2 MB.
        client_max_body_size 3m;

        error_page 502 503 504 = @api_unavailable;
    }

    # ---- WebSocket (/ws/v1/session/{session_id}?token=...) ---------------
    location ^~ /ws/ {
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Clients heartbeat every 15 s; keep the socket open well past that.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;

        # The error log prints the full request line (including ?token=).
        # Only log critical problems for this location to keep tokens out of logs.
        error_log /dev/stderr crit;

        error_page 502 503 504 = @api_unavailable;
    }

    location @api_unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        # Gateway-level body; deliberately not the ApiError shape (that comes from the API itself).
        return 502 '{"gateway":"api_unavailable"}';
    }

    # ---- Everything else: static host shell (wired up in Task 6.2) -------
    location / {
        try_files $uri $uri/ =404;
    }
}
